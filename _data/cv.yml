    Publications:
      - title: The Effect of Mass Loss and Convective Overshooting on the Pre-Collapse Structure, Composition, and Neutrino Emission of Red Supergiants
        authors:
          - McKenzie A. Myers, Claire B. Cammpbell, Kelly M. Patton, Segev BenZvi, Marta Colomer Molla, Alec Habig, James P. Kneller, Dan Milisavljevic, Jeffrey Tseng
        publisher: arXiv preprint
        releaseDate: 2026-04-24
        url: https://arxiv.org/abs/2604.22605
        summary: The first study of how varying the treatment of mass loss and overshooting together affects the pre-collapse core properties and neutrino emission of red supergiants.

      - title: Neutrino flavor mixing with moments
        authors:
          - McKenzie Myers, Theo Cooper, MacKenzie Warren, Jim Kneller, Gail McLaughlin, Sherwood Richers, Evan Grohs, Carla Fröhlich 
        publisher: Physical Review D
        releaseDate: 2022-06-30
        url: https://journals.aps.org/prd/abstract/10.1103/PhysRevD.105.123036
        summary: We present an efficient implementation of neutrino transformation using quantum angular moments in the free streaming, spherically symmetric bulb model. We compare the results against analytic solutions and the results from more exact multiangle neutrino flavor evolution calculations. 

      - title: "SNEWPY: A Data Pipeline from Supernova Simulations to Neutrino Signals"
        authors:
          - A. L. Baxter, S. BenZvi, J. Castaneda, A. Coleiro, M. Colomer Molla, D. Dornic, S. Griswold, T. Goldhagen, A. Graf, A. Habig, R. Hill, S. Horiuchi, J. P. Kneller, M. Lamoureux, R. F. Lang, M. Lincetto, J. Migenda, M. Myers, E. O'Connor, A. Renshaw, K. Scholberg, A. Sheshukov, J. Tseng, C. Tunnell, N. Uberoi, A. Worlikar
        publisher: Journal of Open Source Software
        releaseDate: 2021-11-27
        url: https://joss.theoj.org/papers/10.21105/joss.03772
        summary: SNEWPY offers a unified interface for hundreds of supernova simulations, a large library of flux transformations on the way towards the detector, and an interface to SNOwGLoBES, allowing users to easily calculate and compare expected event rates from many supernova models in many different neutrino detectors.

